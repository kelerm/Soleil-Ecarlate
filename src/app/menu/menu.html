<div *transloco="let t">

    <div class="menu-container" [class.accessible-mode]="isAccessibleMode">
        <h1 class="game-title">{{ t('menu.guilde') }}</h1>

        <div class="buttons-list">
            @if (activeLang != 'fr') {
                <button class="menu-btn disabled" disabled>{{ t('menu.new_game') }}</button>
            } @else {
                <button (click)="commencerPartie()" class="menu-btn">{{ t('menu.new_game') }}</button>
            }
            <button class="menu-btn disabled" disabled>{{ t('menu.continue') }}</button>
            <button class="menu-btn disabled" disabled>{{ t('menu.load') }}</button>
        </div>
        <div class="buttons-lang">
            <button class="menu-btn" (click)="setLang('fr')">FR</button>
            <button class="menu-btn" (click)="setLang('en')">GB</button>
            <button class="menu-btn" (click)="toggleAccessibility()">Aa</button>
        </div>
    </div>
